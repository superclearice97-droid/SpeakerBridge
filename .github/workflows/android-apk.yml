# Builds the Android APK in the cloud on every push, so you can install it
# straight from your phone: open the repo's "Releases" page and tap the .apk.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "SpeakerBridge-0.1-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakerBridge-apk
          path: android/SpeakerBridge-*.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SpeakerBridge 0.1 (build ${{ github.run_number }})
          body: Debug build of the Android app. Download the .apk on your phone and open it to install.
          prerelease: true
          files: android/SpeakerBridge-*.apk
