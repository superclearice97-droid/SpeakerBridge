# Builds the Android APK in the cloud on every push, so you can install it
# straight from your phone: open the repo's "Releases" page and tap the .apk.
name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", "shared/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      SB_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Signs with your permanent key when the two secrets exist (scripts/make-signing-key.sh sets
      # them), so each build installs over the last. Otherwise Android's throwaway key is used.
      - name: Signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
            echo "SB_KEYSTORE=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
            echo "note=Signed with this project's permanent key: it installs straight over an earlier build signed the same way." >> "$GITHUB_OUTPUT"
          else
            echo "note=Signed with a throwaway key: uninstall the old SpeakerBridge before installing this one. (Run scripts/make-signing-key.sh once to avoid that.)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        env:
          SB_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon assembleDebug > build.log 2>&1
          rc=$?
          # Surface the real errors as annotations so they are easy to read
          grep -E "^e: |error:|What went wrong|Could not|FAILED|Execution failed|> " build.log | head -40 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          exit $rc

      - name: Unit tests
        continue-on-error: true
        run: |
          set +e
          ./gradlew --no-daemon testDebugUnitTest > test.log 2>&1
          rc=$?
          grep -E "^e: |FAILED|What went wrong|Could not" test.log | head -20 | while IFS= read -r l; do echo "::warning::${l:0:400}"; done
          exit $rc

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "SpeakerBridge-0.5-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakerBridge-apk
          path: android/SpeakerBridge-*.apk

      - name: Publish as a release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SpeakerBridge 0.5 (build ${{ github.run_number }})
          body: |
            The Android app. Download the .apk on your phone and open it to install.

            ${{ steps.signing.outputs.note }}
          prerelease: true
          files: android/SpeakerBridge-*.apk
