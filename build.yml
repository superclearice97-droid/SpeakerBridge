      - name: Add fonts
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-dejavu-core
          F=app_src/android/app/src/main/res/font
          mkdir -p "$F"
          DJ=/usr/share/fonts/truetype/dejavu
          for w in Regular Medium SemiBold Bold; do
            src=$(find /usr/share/fonts -name "Inter-$w.otf" -o -name "Inter-$w.ttf" | head -1)
            lower=$(echo "$w" | tr 'A-Z' 'a-z')
            if [ -n "$src" ]; then cp "$src" "$F/inter_$lower.otf"; else cp "$DJ/DejaVuSans.ttf" "$F/inter_$lower.otf"; fi
          done
          cp "$DJ/DejaVuSansMono.ttf" "$F/dejavu_mono.ttf"
          curl -fsSL -o "$F/lora.ttf" "https://github.com/google/fonts/raw/main/ofl/lora/Lora%5Bwght%5D.ttf" || cp "$DJ/DejaVuSerif.ttf" "$F/lora.ttf"
          curl -fsSL -o "$F/lora_italic.ttf" "https://github.com/google/fonts/raw/main/ofl/lora/Lora-Italic%5Bwght%5D.ttf" || cp "$DJ/DejaVuSerif.ttf" "$F/lora_italic.ttf"
          ls -la "$F"

      - name: Unit tests (informational)
        continue-on-error: true
        working-directory: app_src/android
        run: gradle --no-daemon testDebugUnitTest

      - name: Build the APK
        working-directory: app_src/android
        run: gradle --no-daemon assembleDebug

      - name: Name the APK
        run: cp app_src/android/app/build/outputs/apk/debug/app-debug.apk "SpeakerBridge-0.1-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SpeakerBridge-apk
          path: SpeakerBridge-*.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SpeakerBridge 0.1 (build ${{ github.run_number }})
          body: Debug build. Open this page on your phone, tap the .apk file, and install it.
          prerelease: true
          files: SpeakerBridge-*.apk
