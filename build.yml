# SpeakerBridge: builds the Android app on GitHub's servers.
# This single file contains the whole app source (packed, so it looks like noise).
# How to use: put this file at .github/workflows/build.yml in your repo, commit it,
# open the Actions tab and wait ~10 minutes, then install the APK from the Releases page.
name: Build SpeakerBridge APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Unpack the app source
